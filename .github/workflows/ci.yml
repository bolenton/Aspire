name: CI

on:
  push:
  pull_request:

jobs:
  engine-tests:
    name: StoryEngine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/StoryEngine

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - run: >
          xcodebuild build
          -project Lantern.xcodeproj
          -scheme Lantern
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
